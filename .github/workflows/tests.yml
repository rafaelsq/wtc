name: tests
on: [push, pull_request]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27
      - name: Check out code into the Go module directory
        uses: actions/checkout@v6
      - name: Test
        run: go test -race -cover ./...
